<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>桌面清洁助手</title><link rel="stylesheet" href="style.css"/></head>
<body><main>
  <header><div class="brand"><span class="mark">✦</span><div><h1>桌面清洁助手</h1><p>看清去向，再一键整理。</p></div></div><div class="header-actions"><button class="ghost" id="resetBtn" hidden>返回初始页</button><button class="ghost" id="historyBtn">整理历史</button><button class="ghost" id="settingsBtn">设置</button><button class="scan" id="scanBtn">扫描桌面</button></div></header>
  <section class="intro" id="intro"><div><span class="eyebrow">本地处理 · 随时撤销</span><h2>让桌面回到清爽、可找回的状态。</h2><p>仅扫描桌面第一层文件，不读取文件内容。确认前不会移动任何文件。</p></div><div class="intro-icon">⌁</div></section>
  <section class="summary" id="summary"><div><b id="fileCount">—</b><span>待整理文件</span></div><div><b id="folderCount">—</b><span>建议目标文件夹</span></div><div><b id="keepCount">—</b><span>保留原位</span></div><p id="scanNote">点击「扫描桌面」开始生成整理预览。</p></section>
  <section class="canvas" id="canvas"><div class="empty"><span>⌘</span><h3>还没有整理计划</h3><p>扫描后，文件会按项目或月份显示在这里。</p></div></section>
  <footer><span id="footerNote">确认前不会移动任何文件。</span><div><button class="ghost" id="newFolderBtn">＋ 新建目标</button><button class="apply" id="applyBtn" disabled>应用整理</button></div></footer>
</main>
<dialog id="settingsDialog"><form method="dialog" class="modal"><button class="close">×</button><span class="eyebrow">设置</span><h2>整理规则</h2><label>归档根目录 <div class="path-row"><input id="rootInput"/><button type="button" id="chooseRoot">选择…</button></div></label><p class="hint">默认位于桌面「桌面整理」。为保证可撤销，必须与桌面在同一磁盘。</p><div class="rule-head"><h3>项目与固定事务</h3><button type="button" id="addRule">＋ 添加规则</button></div><div id="rules"></div><menu><button value="cancel" class="ghost">取消</button><button value="default" id="saveSettings" class="apply">保存设置</button></menu></form></dialog>
<dialog id="historyDialog"><form method="dialog" class="modal wide"><button class="close">×</button><span class="eyebrow">操作记录</span><h2>整理历史</h2><div id="historyList"></div><menu><button class="ghost">关闭</button></menu></form></dialog>
<dialog id="newTargetDialog"><form id="newTargetForm" class="modal"><button type="button" class="close" id="closeNewTarget">×</button><span class="eyebrow">本次整理预览</span><h2>新建整理目标</h2><label>文件夹名称<input id="newTargetName" autocomplete="off" placeholder="例如：生态环境厅项目" maxlength="80" required/></label><p class="hint" id="newTargetHint">文件夹会创建在「桌面整理 / 进行中」；确认应用整理后才会写入磁盘。</p><menu><button type="button" class="ghost" id="cancelNewTarget">取消</button><button class="apply" type="submit">创建目标</button></menu></form></dialog>
<template id="ruleTemplate"><div class="rule"><select><option value="project">项目</option><option value="fixed">固定事务</option></select><input class="rule-name" placeholder="例如：客户A-官网改版"/><input class="rule-keywords" placeholder="关键词；支持中英文逗号、分号、换行"/><input class="rule-priority" type="number" min="0" step="1" value="0" title="数值越大，冲突时越优先"/><button type="button" class="delete">×</button></div></template>
<link rel="stylesheet" href="fixes.css"/><script src="plan-interactions.js"></script><script src="keyword-parser.js"></script><script src="renderer.js"></script></body></html>
